syntax = "proto3";

package fuse_bridge;

// Rust → Node (requests)

message FuseRequest {
  uint64 id = 1;

  oneof op {
    GetattrRequest getattr = 10;
    ReaddirRequest readdir = 11;
    ReadRequest read = 12;
    WriteRequest write = 13;
    OpenRequest open = 14;
    ReleaseRequest release = 15;
    TruncateRequest truncate = 16;
    CreateRequest create = 17;
    UnlinkRequest unlink = 18;
    MkdirRequest mkdir = 19;
    RmdirRequest rmdir = 20;
  }
}

message GetattrRequest {
  string path = 1;
}

message ReaddirRequest {
  string path = 1;
}

message ReadRequest {
  string path = 1;
  uint64 offset = 2;
  uint32 size = 3;
}

message WriteRequest {
  string path = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message OpenRequest {
  string path = 1;
  uint32 flags = 2;
}

message ReleaseRequest {
  string path = 1;
}

message TruncateRequest {
  string path = 1;
  uint64 size = 2;
}

message CreateRequest {
  string path = 1;
  uint32 mode = 2;
}

message UnlinkRequest {
  string path = 1;
}

message MkdirRequest {
  string path = 1;
  uint32 mode = 2;
}

message RmdirRequest {
  string path = 1;
}

// Node → Rust (responses)

message FuseResponse {
  uint64 id = 1;
  int32 error = 2;

  oneof result {
    StatResult stat = 10;
    ReaddirResult readdir = 11;
    ReadResult read = 12;
    WriteResult write = 13;
  }
}

message StatResult {
  uint32 mode = 1;
  string kind = 2;
  uint64 size = 3;
  int64 atime = 4;
  int64 mtime = 5;
  int64 ctime = 6;
  uint32 nlink = 7;
}

message ReaddirResult {
  repeated DirEntry entries = 1;
}

message DirEntry {
  string name = 1;
  string kind = 2;
}

message ReadResult {
  bytes data = 1;
}

message WriteResult {
  uint32 written = 1;
}
